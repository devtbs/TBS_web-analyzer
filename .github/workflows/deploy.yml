name: CI/CD

# Build-check every push/PR; deploy to prod only on push to main (after the check passes).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Build check (backend syntax + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check (no deps needed)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend

      - name: Frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Wait for production to pick up this commit
    needs: build-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-prod          # never run two deploys at once
    steps:
      # The server firewall drops inbound SSH from GitHub runners, so CI cannot push a deploy in
      # (that is what silently broke deploys on 2026-08-19). Instead the server polls GitHub itself
      # -- scripts/auto_deploy.sh from clawdbot's crontab -- and publishes the deployed SHA to
      # /version.json. CI waits for that to match this commit, which is stronger proof than the old
      # "the SSH command exited 0": it confirms the running site is actually serving this code.
      - name: Wait for prod to report this commit
        run: |
          set -euo pipefail
          echo "waiting for prod to report $GITHUB_SHA"
          for i in $(seq 1 40); do            # 40 x 15s = 10 minutes
            SHA=$(curl -fsS --max-time 10 "https://tool.tbs-dev.com/version.json?cb=$RANDOM" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || echo "")
            if [ "$SHA" = "$GITHUB_SHA" ]; then
              echo "prod is serving $SHA (after $((i * 15))s)"
              exit 0
            fi
            echo "  attempt $i/40: prod on ${SHA:-unknown}"
            sleep 15
          done
          echo "::error::Prod did not pick up $GITHUB_SHA within 10 minutes."
          echo "::error::Check the poller on the server: tail /home/clawdbot/auto_deploy.log"
          exit 1
